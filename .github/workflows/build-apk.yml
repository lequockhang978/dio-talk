name: Build Dio Talk APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/dio-talk-v1.0.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dio-talk-v1.0.1-apk
          path: release-apk/dio-talk-v1.0.1.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: 'Dio Talk v1.0.1 • MC1 VERSION'
          body: |
            ## ⚓ Dio Talk v1.0.1 - MC1 VERSION (STCW 78/2010)
            - **Tác giả**: LÊ QUỐC KHANG
            - **Cập nhật**:
              - Logo Squircle viền bo chuẩn nét, nền trong suốt.
              - Tự động kiểm tra bản cập nhật online.
              - 15 Minigame tương tác chống lặp câu hỏi.
              - Danh mục 20 AI Model hàng hải.
            
            👉 **Tải trực tiếp file APK cài đặt bên dưới**: `dio-talk-v1.0.1.apk`
          files: release-apk/dio-talk-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
